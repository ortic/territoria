name: Pages

# The browser version at https://ortic.github.io/territoria/
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # SQLite is compiled for wasm with clang and llvm-ar (a self-hosted
      # runner brings its own).
      - if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang llvm
      - name: Install Trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin"
      - name: Build
        working-directory: crates/territoria-app
        run: trunk build --release --public-url /territoria/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crates/territoria-app/dist
      - if: always() && runner.environment == 'self-hosted'
        run: cargo clean

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
