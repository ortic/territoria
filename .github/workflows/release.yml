name: Release

# Pushing a tag such as v0.1.0 builds the AppImage, the macOS disk image and
# the Windows installer, and publishes them as a GitHub release.
# The tag must match the version in Cargo.toml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: write

# The runners follow the repository variables described in ci.yml. With
# HOSTED_RUNNERS off the release carries only the AppImage.
jobs:
  linux:
    # Hosted: the oldest supported image, so the AppImage runs on older
    # systems too.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: sh packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/Territoria-*.AppImage
      - if: always() && runner.environment == 'self-hosted'
        run: cargo clean

  macos:
    if: vars.HOSTED_RUNNERS != 'off'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: sh packaging/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/Territoria-*.dmg

  windows:
    if: vars.HOSTED_RUNNERS != 'off'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: dotnet tool install --global wix --version 5.0.2
      - run: powershell -ExecutionPolicy Bypass -File packaging\build-msi.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/Territoria-*.msi

  release:
    needs: [linux, macos, windows]
    # Skipped macOS and Windows jobs don't hold the release back.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      needs.linux.result == 'success' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Territoria ${GITHUB_REF_NAME#v}" --generate-notes
