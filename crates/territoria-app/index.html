<!doctype html>
<!-- The page for the browser version, built with Trunk (see README). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Territoria</title>
    <meta name="description" content="Geomarketing and territory planning in the browser." />
    <link data-trunk rel="rust" data-bin="territoria" data-wasm-opt="s" />
    <link data-trunk rel="icon" href="../../packaging/territoria.svg" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f4f4f4;
        color: #555;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #1b1b1b;
          color: #aaa;
        }
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 32em;
        text-align: center;
        font: 16px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <canvas id="territoria"></canvas>
    <div id="loading">Loading Territoria…</div>
    <noscript>Territoria needs JavaScript and WebAssembly.</noscript>
  </body>
</html>
