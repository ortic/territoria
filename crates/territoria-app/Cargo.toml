[package]
name = "territoria-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Geomarketing and territory planning"
authors = ["Remo Laubacher"]

[[bin]]
name = "territoria"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_extras.workspace = true
geo-types.workspace = true
rfd.workspace = true
territoria-optimize.workspace = true
serde.workspace = true
serde_json.workspace = true
territoria-analysis.workspace = true
territoria-config.workspace = true
territoria-data.workspace = true
territoria-expr.workspace = true
territoria-geo.workspace = true
territoria-io.workspace = true
territoria-model.workspace = true
territoria-render.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq.workspace = true
resvg = "0.45"
svg2pdf = "0.13"
pdf-writer = "0.12"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }

# The icon in the Windows .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
