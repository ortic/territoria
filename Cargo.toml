[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
territoria-analysis = { path = "crates/territoria-analysis" }
territoria-config = { path = "crates/territoria-config" }
territoria-data = { path = "crates/territoria-data" }
territoria-expr = { path = "crates/territoria-expr" }
territoria-geo = { path = "crates/territoria-geo" }
territoria-io = { path = "crates/territoria-io" }
territoria-model = { path = "crates/territoria-model" }
territoria-optimize = { path = "crates/territoria-optimize" }
territoria-render = { path = "crates/territoria-render" }
territoria-ui = { path = "crates/territoria-ui" }

# The UI stack is the one Pythia uses (egui on wgpu, glow as fallback).
eframe = { version = "0.36", default-features = false, features = ["wgpu", "glow", "default_fonts", "accesskit", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_plot = "0.37"
rfd = "0.17"

# Geometry, coordinate systems and spatial indexes, all pure Rust.
geo = "0.33"
geo-types = "0.7"
rstar = "0.12"
proj4rs = "0.2"
crs-definitions = { version = "0.6", features = ["proj4", "wkt"] }
earcutr = "0.5"

# File formats.
shapefile = "0.9"
dbase = "0.8"
geojson = "1"
csv = "1"
calamine = "0.37"
rust_xlsxwriter = "0.101"
zip = { version = "9", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"

logos = "0.16"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
rayon = "1"
insta = "1"
# Blocking HTTP (geocoding, boundary downloads, map tiles); rustls, no async runtime.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Keep dev builds small and fast: full debug info only for our own crates.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
